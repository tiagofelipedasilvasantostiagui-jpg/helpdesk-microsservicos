services:
  usuarios:
    build:
      context: ./app/servicos/usuarios
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////dados/usuarios.db
      JWT_SEGREDO: ${JWT_SEGREDO:?JWT_SEGREDO precisa estar no .env}
      DADOS_EXEMPLO: ${DADOS_EXEMPLO:-1}
    volumes:
      - dados_usuarios:/dados
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/saude')"]
      interval: 10s
      timeout: 5s
      retries: 5

  inventario:
    build:
      context: ./app/servicos/inventario
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////dados/inventario.db
      JWT_SEGREDO: ${JWT_SEGREDO:?JWT_SEGREDO precisa estar no .env}
    volumes:
      - dados_inventario:/dados
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/saude')"]
      interval: 10s
      timeout: 5s
      retries: 5

  chamados:
    build:
      context: ./app/servicos/chamados
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////dados/chamados.db
      JWT_SEGREDO: ${JWT_SEGREDO:?JWT_SEGREDO precisa estar no .env}
      USUARIOS_URL: http://usuarios:8000
      INVENTARIO_URL: http://inventario:8000
      HTTP_TIMEOUT: "3"
    volumes:
      - dados_chamados:/dados
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      usuarios:
        condition: service_healthy
      inventario:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/saude')"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: app/gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      USUARIOS_URL: http://usuarios:8000
      INVENTARIO_URL: http://inventario:8000
      CHAMADOS_URL: http://chamados:8000
      HTTP_TIMEOUT: "5"
    depends_on:
      usuarios:
        condition: service_healthy
      inventario:
        condition: service_healthy
      chamados:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  dados_usuarios:
  dados_inventario:
  dados_chamados:
